syntax = "proto3";

package textservice;

option go_package = "./textpb";

// The service definition
service TextService {
  // Accepts a text string and returns the processed text
  rpc ProcessText (TextRequest) returns (TextResponse);
}

// Request payload sent from Go -> Python
message TextRequest {
  string text = 1;
}

// Response payload sent back from Python -> Go
message TextResponse {
  string result = 1;
}